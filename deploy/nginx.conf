# B18: two sites in the web container. Published by deploy/compose.yml on 127.0.0.1 only.
#   8080  the app (web/dist), /api and /oauth proxied to the api; B19 maps app.<domain> here.
#   8081  the landing page (landing/index.html); B19 maps <domain> here.
# TLS ends in front of this container from B19 on; until then it is reached through an SSH tunnel.
# Response headers of TRD 8.7 on every response. nginx only inherits add_header into a location that
# has none of its own, so no location below adds a header.

server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;
    # Behind Cloudflare: a visit over plain http is sent to https (Cloudflare sets X-Forwarded-Proto).
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }
    root /srv/app;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # The Cloudflare tunnel (cloudflared on the host) reaches this container through the Docker
    # network gateway; only from that address is Cloudflare's CF-Connecting-IP believed, so the api
    # sees the visitor's address (rate limits, audit) instead of the tunnel's.
    set_real_ip_from 172.30.18.128;
    real_ip_header CF-Connecting-IP;

    # Uploads are refused by the api above 20 MB (TRD 8.7); a little room for the multipart envelope.
    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ ^/(api|oauth)/ {
        proxy_pass http://api:8101;
        proxy_http_version 1.1;
        # The browser's own Host and Origin reach the api unchanged (its Origin check compares with
        # MATCHDESK_APP_BASE_URL). X-Forwarded-For is believed only from MATCHDESK_TRUSTED_PROXIES.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_request_buffering on;
    }

    # The PDF.js worker is an ES module (.mjs), which nginx's mime.types does not know; browsers
    # refuse a module script served as application/octet-stream.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        try_files $uri =404;
        expires 30d;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 8081;
    server_name _;
    # Behind Cloudflare: a visit over plain http is sent to https (Cloudflare sets X-Forwarded-Proto).
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }
    root /srv/landing;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # The landing page's own policy: inline script and style allowed by hash, Google Fonts
    # (generated at build time by deploy/landing-csp.mjs).
    include /etc/nginx/snippets/landing-csp.conf;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Legal pages have their own addresses (Intuit asks for them); the page shows the view by path.
    location ~ ^/(privacy|terms|pilot-agreement)/?$ {
        try_files /index.html =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / {
        try_files /index.html =404;
    }

    location = /favicon.svg {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
