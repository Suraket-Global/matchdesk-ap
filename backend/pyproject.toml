[project]
name = "matchdesk"
version = "0.1.0"
description = "MatchDesk AP three-way match (build milestones B1, B2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pypdf==7.0.1",
    "SQLAlchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "boto3==1.44.0",
    "cryptography==50.0.2",
    "python-multipart==0.0.33",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "hypothesis==6.170.15",
    "httpx==0.28.1",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "import-linter==2.16",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs the PostgreSQL test database"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915", "PLR0911", "PLR0917", "PLC0415", "E501", "S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S603", "PLC0415"]
"migrations/**" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["matchdesk"]
strict = true
warn_unused_ignores = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["matchdesk.api.*"]
disallow_untyped_decorators = false

[tool.importlinter]
root_package = "matchdesk"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "matching is pure: core only, no I/O libraries"
type = "forbidden"
source_modules = ["matchdesk.matching"]
forbidden_modules = [
    "matchdesk.tenancy", "matchdesk.blobstore", "matchdesk.identity", "matchdesk.qbo",
    "matchdesk.receiving", "matchdesk.intake", "matchdesk.extraction", "matchdesk.exceptions",
    "matchdesk.reporting", "matchdesk.audit", "matchdesk.api", "matchdesk.worker",
    "sqlalchemy", "fastapi", "httpx", "psycopg",
]
allow_indirect_imports = false

[[tool.importlinter.contracts]]
name = "core is standard library only"
type = "forbidden"
source_modules = ["matchdesk.core"]
forbidden_modules = [
    "matchdesk.tenancy", "matchdesk.blobstore", "matchdesk.identity", "matchdesk.qbo",
    "matchdesk.receiving", "matchdesk.intake", "matchdesk.extraction", "matchdesk.exceptions",
    "matchdesk.reporting", "matchdesk.audit", "matchdesk.matching", "matchdesk.api",
    "matchdesk.worker", "sqlalchemy", "fastapi", "pydantic", "psycopg",
]

[[tool.importlinter.contracts]]
name = "domain modules never import the entry points"
type = "forbidden"
source_modules = [
    "matchdesk.core", "matchdesk.tenancy", "matchdesk.blobstore", "matchdesk.identity",
    "matchdesk.qbo", "matchdesk.receiving", "matchdesk.intake", "matchdesk.extraction",
    "matchdesk.matching", "matchdesk.exceptions", "matchdesk.reporting", "matchdesk.audit",
]
forbidden_modules = ["matchdesk.api", "matchdesk.worker"]

[[tool.importlinter.contracts]]
name = "exceptions reads other modules' models only (TRD 5, B1-009)"
type = "forbidden"
source_modules = ["matchdesk.exceptions"]
forbidden_modules = [
    "matchdesk.identity", "matchdesk.blobstore", "matchdesk.reporting", "matchdesk.api", "matchdesk.worker",
    "fastapi", "httpx",
]

[[tool.importlinter.contracts]]
name = "worker never imports api or a web framework (R-07)"
type = "forbidden"
source_modules = ["matchdesk.worker"]
forbidden_modules = ["matchdesk.api", "fastapi", "starlette", "uvicorn"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
